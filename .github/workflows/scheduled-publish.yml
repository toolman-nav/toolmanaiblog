name: Publish scheduled posts

on:
  push:
    branches: [website-h5]
    paths: ['.github/workflows/scheduled-publish.yml', 'scripts/scheduled-publish.mjs']
  schedule:
    - cron: '0 0 * * *'
    # Retry off the hour, including catch-up after outages. UTC times.
    - cron: '13,43 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-publish
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: website-h5
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check due articles against production
        id: due
        run: node scripts/scheduled-publish.mjs
      - name: Trigger production Pages build only when articles are missing
        if: steps.due.outputs.needed == 'true'
        env:
          DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo 'Missing CLOUDFLARE_PAGES_DEPLOY_HOOK' >&2
            exit 1
          fi
          curl --fail --silent --show-error --max-time 60 --output /dev/null --request POST "$DEPLOY_HOOK"
      - name: Verify articles are online after deployment
        if: steps.due.outputs.needed == 'true'
        run: node scripts/scheduled-publish.mjs --verify
      - name: Report failure
        if: failure()
        run: |
          echo '::error::Scheduled publication failed. Check the failing step; the next scheduled check will retry.'
          echo 'Publication check or deployment failed. Enable GitHub Actions failure notifications to receive email.' >> "$GITHUB_STEP_SUMMARY"
