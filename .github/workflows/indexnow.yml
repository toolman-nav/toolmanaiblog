name: Notify IndexNow after production deploy

on:
  push:
    branches:
      - website-h5

permissions:
  contents: read

concurrency:
  group: indexnow-production
  cancel-in-progress: true

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect URLs affected by this push
        id: changes
        env:
          BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          plan_file="$RUNNER_TEMP/indexnow-plan.txt"
          node scripts/collect-indexnow-urls.cjs "$BEFORE_SHA" "$GITHUB_SHA" > "$plan_file"
          if grep -qx '__INDEXNOW_ALL__' "$plan_file"; then
            echo "mode=remote" >> "$GITHUB_OUTPUT"
          elif [ -s "$plan_file" ]; then
            echo "mode=urls" >> "$GITHUB_OUTPUT"
          else
            echo "mode=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for the matching Cloudflare Pages deployment
        if: steps.changes.outputs.mode != 'none'
        run: node scripts/wait-for-deployment.cjs "$GITHUB_SHA"

      - name: Submit changed URLs to IndexNow
        if: steps.changes.outputs.mode == 'urls'
        run: node scripts/submit-indexnow.cjs --remote

      - name: Submit production sitemap URLs to IndexNow
        if: steps.changes.outputs.mode == 'remote'
        run: node scripts/submit-indexnow.cjs --remote
